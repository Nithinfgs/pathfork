<svg xmlns="http://www.w3.org/2000/svg" width="939" height="794" viewBox="0 0 939 794" role="img" aria-label="pathfork output: node resolves to different versions depending on how the shell starts">
<rect width="939" height="794" rx="10" fill="#0d1117"/>
<rect width="939" height="36" rx="10" fill="#161b22"/><rect y="26" width="939" height="10" fill="#161b22"/>
<circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#c9d1d9">
<text x="24" y="64" xml:space="preserve"><tspan fill="#7ee787">$</tspan><tspan> pathfork --demo node uv git --contexts terminal,non-interactive,cron</tspan></text>
<text x="24" y="83" xml:space="preserve"></text>
<text x="24" y="102" xml:space="preserve"><tspan font-weight="700">pathfork</tspan><tspan> </tspan><tspan fill="#6e7681">0.1.0</tspan><tspan> </tspan><tspan fill="#6e7681">·</tspan><tspan> bash </tspan><tspan fill="#6e7681">·</tspan><tspan> darwin</tspan></text>
<text x="24" y="121" xml:space="preserve"></text>
<text x="24" y="140" xml:space="preserve"><tspan>  </tspan><tspan font-weight="700">terminal       </tspan><tspan>  </tspan><tspan fill="#6e7681">bash -l -i -c       </tspan><tspan> </tspan><tspan fill="#6e7681">the shell you type into (login + interactive)</tspan></text>
<text x="24" y="159" xml:space="preserve"><tspan>  </tspan><tspan font-weight="700">non-interactive</tspan><tspan>  </tspan><tspan fill="#6e7681">bash -c             </tspan><tspan> </tspan><tspan fill="#6e7681">plain `shell -c` (make, git hooks, editor tasks, many agent tools)</tspan></text>
<text x="24" y="178" xml:space="preserve"><tspan>  </tspan><tspan font-weight="700">cron           </tspan><tspan>  </tspan><tspan fill="#6e7681">env -i /bin/sh -c   </tspan><tspan> </tspan><tspan fill="#6e7681">cron-like: empty environment, /bin/sh</tspan></text>
<text x="24" y="197" xml:space="preserve"></text>
<text x="24" y="216" xml:space="preserve"><tspan fill="#ff7b72">✗</tspan><tspan> </tspan><tspan font-weight="700">node</tspan><tspan> </tspan><tspan fill="#6e7681">·</tspan><tspan> 2 different versions: 18.19.1 vs 22.4.0</tspan></text>
<text x="24" y="235" xml:space="preserve"><tspan>    v18.19.1   ~/system/bin/node  </tspan><tspan fill="#6e7681">non-interactive, cron</tspan></text>
<text x="24" y="254" xml:space="preserve"><tspan>    v22.4.0    ~/.nvm/versions/node/v22.4.0/bin/node  </tspan><tspan fill="#6e7681">terminal</tspan></text>
<text x="24" y="273" xml:space="preserve"><tspan>    </tspan><tspan fill="#6e7681">why  </tspan><tspan> ~/.bashrc:8 adds it: export PATH="$NVM_DIR/versions/node/v22.4.0/bin:$PATH"</tspan></text>
<text x="24" y="292" xml:space="preserve"><tspan>          ~/.bashrc:2 returns early for non-interactive shells</tspan></text>
<text x="24" y="311" xml:space="preserve"><tspan>          so it does not apply in: non-interactive, cron</tspan></text>
<text x="24" y="330" xml:space="preserve"><tspan>          nvm has no shims, so only shells that source nvm.sh see its node. Either source it</tspan></text>
<text x="24" y="349" xml:space="preserve"><tspan>          from a file those shells read, or switch to a shim-based manager (fnm, mise, volta,</tspan></text>
<text x="24" y="368" xml:space="preserve"><tspan>          asdf).</tspan></text>
<text x="24" y="387" xml:space="preserve"></text>
<text x="24" y="406" xml:space="preserve"><tspan fill="#ff7b72">✗</tspan><tspan> </tspan><tspan font-weight="700">uv</tspan><tspan> </tspan><tspan fill="#6e7681">·</tspan><tspan> missing in non-interactive, cron</tspan></text>
<text x="24" y="425" xml:space="preserve"><tspan>    </tspan><tspan fill="#ff7b72">not found </tspan><tspan>  </tspan><tspan fill="#6e7681">non-interactive, cron</tspan></text>
<text x="24" y="444" xml:space="preserve"><tspan>    v0.4.2     ~/.local/bin/uv  </tspan><tspan fill="#6e7681">terminal</tspan></text>
<text x="24" y="463" xml:space="preserve"><tspan>    </tspan><tspan fill="#6e7681">why  </tspan><tspan> ~/.bash_profile:4 adds it: export PATH="$HOME/brew/bin:$HOME/.local/bin:$PATH"</tspan></text>
<text x="24" y="482" xml:space="preserve"><tspan>          ~/.bash_profile is only read by login shells</tspan></text>
<text x="24" y="501" xml:space="preserve"><tspan>          so it does not apply in: non-interactive, cron</tspan></text>
<text x="24" y="520" xml:space="preserve"></text>
<text x="24" y="539" xml:space="preserve"><tspan fill="#7ee787">✓</tspan><tspan> consistent everywhere: </tspan><tspan fill="#6e7681">git 2.39.3</tspan></text>
<text x="24" y="558" xml:space="preserve"></text>
<text x="24" y="577" xml:space="preserve"><tspan fill="#ff7b72">✗</tspan><tspan> </tspan><tspan font-weight="700">project</tspan><tspan> .nvmrc wants node </tspan><tspan font-weight="700">22</tspan></text>
<text x="24" y="596" xml:space="preserve"><tspan>    </tspan><tspan fill="#7ee787">✓</tspan><tspan> terminal         v22.4.0</tspan></text>
<text x="24" y="615" xml:space="preserve"><tspan>    </tspan><tspan fill="#ff7b72">✗</tspan><tspan> non-interactive  v18.19.1</tspan></text>
<text x="24" y="634" xml:space="preserve"><tspan>    </tspan><tspan fill="#ff7b72">✗</tspan><tspan> cron             v18.19.1</tspan></text>
<text x="24" y="653" xml:space="preserve"></text>
<text x="24" y="672" xml:space="preserve"><tspan fill="#ff7b72">✗</tspan><tspan> </tspan><tspan font-weight="700">project</tspan><tspan> package.json engines.node wants node </tspan><tspan font-weight="700">&gt;=20</tspan></text>
<text x="24" y="691" xml:space="preserve"><tspan>    </tspan><tspan fill="#7ee787">✓</tspan><tspan> terminal         v22.4.0</tspan></text>
<text x="24" y="710" xml:space="preserve"><tspan>    </tspan><tspan fill="#ff7b72">✗</tspan><tspan> non-interactive  v18.19.1</tspan></text>
<text x="24" y="729" xml:space="preserve"><tspan>    </tspan><tspan fill="#ff7b72">✗</tspan><tspan> cron             v18.19.1</tspan></text>
<text x="24" y="748" xml:space="preserve"></text>
<text x="24" y="767" xml:space="preserve"><tspan font-weight="700">4 problems, 0 warnings</tspan><tspan fill="#6e7681"> · run `pathfork path` to see which PATH entries differ</tspan></text>
</g>
</svg>
